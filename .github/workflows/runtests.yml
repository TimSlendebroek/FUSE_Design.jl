name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.11"]
        os: [ubuntu-latest, macos-latest]
    env:
      GKSwstype: "100" # headless Plots.jl
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      # The FuseRegistry lists packages via git@ SSH URLs; route GitHub over HTTPS so the public
      # repos clone without SSH keys or a token. (Any private deps simply won't resolve — and a
      # public FUSE shouldn't depend on private packages anyway.)
      - name: Add FuseRegistry (public, over HTTPS)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          julia --color=yes -e 'using Pkg; Pkg.Registry.add(RegistrySpec(url="https://github.com/ProjectTorreyPines/FuseRegistry.jl.git")); Pkg.Registry.add("General"); Pkg.Registry.update()'

      # Always test against the FORK versions of IMAS/EPEDNN — their additions (e.g.
      # IMAS.pedestal_poloidal_beta, EPEDNN.ensemble_uncertainty) are not in the registry.
      # Coordinated changes across the forks use the SAME branch name: clone each fork at the
      # branch matching the FUSE branch under test when it exists, else its master. dev the
      # clones and run the tests in the SAME session so Pkg.test() inherits the dev'd paths
      # and can never fall back to the registry versions.
      - name: Clone matching fork branches (IMAS_Design / EPEDNN_Design)
        env:
          FUSE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in IMAS_Design EPEDNN_Design; do
            url="https://github.com/TimSlendebroek/${repo}.jl.git"
            branch="master"
            if [ -n "$FUSE_BRANCH" ] && git ls-remote --exit-code --heads "$url" "$FUSE_BRANCH" >/dev/null 2>&1; then
              branch="$FUSE_BRANCH"
            fi
            echo "Using ${repo} @ ${branch}"
            git clone --depth 1 --branch "$branch" "$url" "../${repo}"
          done

      - name: Test (fork IMAS_Design / EPEDNN_Design)
        run: |
          julia --project=. --color=yes -e '
            using Pkg
            Pkg.develop([
                PackageSpec(path="../IMAS_Design"),
                PackageSpec(path="../EPEDNN_Design"),
            ])
            Pkg.instantiate()
            Pkg.test()'
