name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.11"]
        # ubuntu only: GitHub's hosted macOS runners were often never assigned (job "not acquired"), which failed
        # whole runs; macOS is covered by running the test suite locally
        os: [ubuntu-latest]
    env:
      GKSwstype: "100" # headless Plots.jl
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      # FuseRegistry from the TimSlendebroek fork: its packages point at the public forks over HTTPS, so
      # nothing needs SSH keys or a token. ProjectTorreyPines is made unreachable, so CI fails if anything
      # still depends on it. The cached registry is dropped first: an old cache holds the upstream one,
      # whose package URLs point at ProjectTorreyPines.
      - name: Add FuseRegistry (fork) and block ProjectTorreyPines
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://ptp-blocked.invalid/".insteadOf "https://github.com/ProjectTorreyPines/"
          git config --global --add url."https://ptp-blocked.invalid/".insteadOf "git@github.com:ProjectTorreyPines/"
          rm -rf ~/.julia/registries/FuseRegistry
          julia --color=yes -e 'using Pkg; Pkg.Registry.add(RegistrySpec(url="https://github.com/TimSlendebroek/FuseRegistry.jl.git")); Pkg.Registry.add("General"); Pkg.Registry.update()'

      # Always test against the FORK versions of IMAS/EPEDNN — their additions (e.g.
      # IMAS.pedestal_poloidal_beta, EPEDNN.ensemble_uncertainty) are not in the registry.
      # Coordinated changes across the forks use the SAME branch name: clone each fork at the
      # branch matching the FUSE branch under test when it exists, else its master. dev the
      # clones and run the tests in the SAME session so Pkg.test() inherits the dev'd paths
      # and can never fall back to the registry versions.
      # FRESCO, TJLFEP (repo TGLFEP.jl) and TroyonBetaNN forks are used only when they have a branch with the
      # FUSE branch name (e.g. lean-deps: they no longer load Plots); otherwise the registry versions.
      - name: Clone matching fork branches
        env:
          FUSE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in IMAS_Design EPEDNN_Design FRESCO TGLFEP TroyonBetaNN; do
            url="https://github.com/TimSlendebroek/${repo}.jl.git"
            if [ -n "$FUSE_BRANCH" ] && git ls-remote --exit-code --heads "$url" "$FUSE_BRANCH" >/dev/null 2>&1; then
              branch="$FUSE_BRANCH"
            elif [ "$repo" = IMAS_Design ] || [ "$repo" = EPEDNN_Design ]; then
              branch="master"
            else
              echo "Using registry ${repo}"
              continue
            fi
            echo "Using ${repo} @ ${branch}"
            git clone --depth 1 --branch "$branch" "$url" "../${repo}"
          done

      # develop/instantiate run with auto-precompile off: otherwise they compile the whole stack with
      # default flags and Pkg.test() compiles it all again with --check-bounds=yes (18 + 25 min cold).
      - name: Test (fork IMAS_Design / EPEDNN_Design, plus any matching forks)
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          julia --project=. --color=yes -e '
            using Pkg
            repos = ("IMAS_Design", "EPEDNN_Design", "FRESCO", "TGLFEP", "TroyonBetaNN")
            Pkg.develop([PackageSpec(path=joinpath("..", r)) for r in repos if isdir(joinpath("..", r))])
            Pkg.instantiate()
            ENV["JULIA_PKG_PRECOMPILE_AUTO"] = "1"
            Pkg.test()'
